[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tierinfer"
version = "0.1.0"
description = "VRAM, RAM and NVMe as one adaptive inference memory hierarchy for large local models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tierinfer = "tierinfer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
